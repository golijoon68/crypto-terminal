<style>
:root{
  --bg:#070b14; --panel:#0f1626; --line:#1f2b44; --text:#e8eefc; --mute:#8091b3;
  --up:#2ee6a6; --down:#ff5c7a; --gold:#f5c451; --accent:#5b8cff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Vazirmatn,Tahoma,sans-serif;color:var(--text);padding:16px;min-height:100vh;
  background:radial-gradient(900px 500px at 85% -10%,#16254a 0,transparent 60%),radial-gradient(700px 400px at 0% 110%,#2a1a3d 0,transparent 55%),var(--bg)}
.wrap{max-width:1200px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px}
h1{font-size:20px;font-weight:800}
.conn{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--down)}
.dot.on{background:var(--up);box-shadow:0 0 10px var(--up)}
.card{background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.015)),var(--panel);
  border:1px solid var(--line);border-radius:14px;padding:14px}
.lbl{font-size:12px;color:var(--mute);margin-bottom:6px}
.val{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.sub{font-size:11px;color:var(--mute);margin-top:4px}
.up{color:var(--up)} .down{color:var(--down)}
.row{display:grid;gap:12px;margin-bottom:12px}
.r4{grid-template-columns:repeat(4,1fr)}
.main{grid-template-columns:2fr 1fr;align-items:start}
.col,.panels{display:flex;flex-direction:column;gap:12px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.ph h3{font-size:14px;font-weight:800}
.badge{font-size:12px;font-weight:800;padding:5px 10px;border-radius:8px;border:1px solid}
.badge.long{background:#0b2a22;color:var(--up);border-color:#14805f}
.badge.short{background:#2e1019;color:var(--down);border-color:#8a2339}
.badge.neutral{background:#2a2410;color:var(--gold);border-color:#7a6320}
.note{font-size:11px;color:var(--mute);line-height:1.9;margin-top:8px}
.cons summary{cursor:pointer;font-size:12px;color:var(--mute);margin-top:10px}
.wrow{display:flex;align-items:center;gap:8px;font-size:12px;padding:5px 0}
.wrow span{width:70px}.wrow input{flex:1;accent-color:var(--accent)}
.lcol{display:flex;flex-direction:column;gap:12px;min-width:0}
#tv{background:#0a1120}
#boot-err{display:none;background:#2e1019;color:#ffb3c1;border:1px solid #8a2339;border-radius:10px;padding:10px;font-size:12px;margin-bottom:10px;direction:ltr;text-align:left;white-space:pre-wrap}
.flash-up{animation:fu .6s} .flash-down{animation:fd .6s}
@keyframes fu{from{background:rgba(46,230,166,.25)}to{background:transparent}}
@keyframes fd{from{background:rgba(255,92,122,.25)}to{background:transparent}}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input{background:#0a1120;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:13px}
.tf button{background:#0a1
